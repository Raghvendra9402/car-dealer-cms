name: Build image and push to dockerhub

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/car-dealer-cms:latest \
                      -t ${{ secrets.DOCKER_USERNAME }}/car-dealer-cms:${{ github.sha }} .

      - name: Push image to docker hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/car-dealer-cms:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/car-dealer-cms:${{ github.sha }}
